[project]
name = "fitnessstudio"
version = "2026.10.1"
description = "AppServer für ein Fitnessstudio mit FastAPI"
authors = [
    { name = "Esma Ak", email = "akes1011@h-ka.de" },
    { name = "Eyübhan Yörümez", email = "yoey1011@h-ka.de" }
]
maintainers = [
    { name = "Esma Ak", email = "akes1011@h-ka.de" },
    { name = "Eyübhan Yörümez", email = "yoey1011@h-ka.de" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
fitness = "fitness:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fitness"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]