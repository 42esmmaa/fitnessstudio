info:
  name: "Neues Mitglied ohne Interessen lesen"
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      query($mitgliedId: ID!) {
        mitglied(mitgliedId: $mitgliedId) {
          id
          version
          vorname
          nachname
          email
          geburtsdatum
          geschlecht
          interessen
          vertrag {
            beginn
            monatlicherBeitrag
            tarif
            getraenkeflat
          }
        }
      }
    variables: |-
      {
        "mitgliedId": "{{graphqlMitgliedId}}"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const response = await bru.sendRequest({
          method: 'QUERY', url: bru.getCollectionVar('tokenUrl'),
          data: { username: bru.getEnvVar('username'), password: bru.getEnvVar('password') },
        });
        if (response.status !== 200) throw new Error('Login fehlgeschlagen');
        bru.setVar('TOKEN', response.data.token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: "application/json"
    - expression: res.body.data.mitglied.interessen
      operator: isNull
    - expression: res.body.data.mitglied.vertrag.tarif
      operator: eq
      value: "STUDENT"
    - expression: res.body.data.mitglied.email
      operator: eq
      value: "{{graphqlTestEmail}}"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
