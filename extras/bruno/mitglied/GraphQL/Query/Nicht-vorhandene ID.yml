info:
  name: "Nicht-vorhandene ID"
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      query($mitgliedId: ID!) {
        mitglied(mitgliedId: $mitgliedId) {
          id
          version
          vorname
          nachname
          email
          geburtsdatum
          geschlecht
          interessen
          vertrag {
            beginn
            monatlicherBeitrag
            tarif
            getraenkeflat
          }
        }
      }
    variables: |-
      {
        "mitgliedId": "999999"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Kein GraphQL-Fehler bei fehlendem Mitglied', () => { expect(res.getBody().errors).to.be.undefined; });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: "application/json"
    - expression: res.body.data.mitglied
      operator: isNull

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
