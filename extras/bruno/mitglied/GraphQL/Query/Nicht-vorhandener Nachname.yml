info:
  name: "Nicht-vorhandener Nachname"
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      query($suchparameter: Suchparameter) {
        mitglieder(suchparameter: $suchparameter) {
          id
          version
          vorname
          nachname
          email
          geburtsdatum
          geschlecht
          interessen
          vertrag {
            beginn
            monatlicherBeitrag
            tarif
            getraenkeflat
          }
        }
      }
    variables: |-
      {
        "suchparameter": {
          "nachname": "Nichtvorhandengraphql"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: "application/json"
    - expression: res.body.data.mitglieder
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
