info:
  name: Dev
  type: folder
  seq: 7
  tags:
    - manual
request:
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: '{{oidcTokenUrl}}'
    credentials:
      clientId: '{{clientId}}'
      clientSecret: '{{clientSecret}}'
      placement: body
    resourceOwner:
      username: '{{username}}'
      password: '{{password}}'
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
docs:
  content: 'Nur manuell ausführen: DB neu laden löscht die Mitgliedstabellen und lädt die CSV-Testdaten neu.'
  type: text/markdown
