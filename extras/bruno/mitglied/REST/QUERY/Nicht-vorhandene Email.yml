info:
  name: Nicht-vorhandene Email
  type: http
  seq: 5
http:
  method: QUERY
  url: '{{restUrl}}/query'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "nichtvorhanden@example.org"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '404'
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
