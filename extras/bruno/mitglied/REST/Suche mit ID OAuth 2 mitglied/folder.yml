info:
  name: Suche mit ID OAuth 2 mitglied
  type: folder
  seq: 4
request:
  auth:
    type: oauth2
    flow: resource_owner_password_credentials
    accessTokenUrl: '{{oidcTokenUrl}}'
    credentials:
      clientId: '{{clientId}}'
      clientSecret: '{{clientSecret}}'
      placement: body
    resourceOwner:
      username: '{{memberUsername}}'
      password: '{{memberPassword}}'
    tokenConfig:
      id: mitglied-credentials
      placement:
        header: Bearer
    settings:
      autoFetchToken: true
      autoRefreshToken: false
