info:
  name: "Version des neuen Mitglieds"
  type: http
  seq: 1

http:
  method: GET
  url: "{{mitgliedUrl}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('VERSION', res.getHeaders()['etag']);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
