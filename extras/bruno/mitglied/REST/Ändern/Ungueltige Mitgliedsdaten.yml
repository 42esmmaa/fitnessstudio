info:
  name: Ungueltige Mitgliedsdaten
  type: http
  seq: 6
http:
  method: PUT
  url: '{{mitgliedUrl}}'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "vorname": "Geaendert",
        "nachname": "falscher_nachname",
        "email": "falsche_email@",
        "geburtsdatum": "2000-01-01",
        "geschlecht": "D",
        "interessen": [
          "Yoga"
        ]
      }
  headers:
    - name: If-Match
      value: '{{VERSION}}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '422'
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
