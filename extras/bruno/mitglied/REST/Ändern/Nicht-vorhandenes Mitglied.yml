info:
  name: Nicht-vorhandenes Mitglied
  type: http
  seq: 8
http:
  method: PUT
  url: '{{restUrl}}/999999'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "vorname": "Geaendert",
        "nachname": "Testrest",
        "email": "{{testEmail}}",
        "geburtsdatum": "2000-01-01",
        "geschlecht": "D",
        "interessen": [
          "Yoga"
        ]
      }
  headers:
    - name: If-Match
      value: '"0"'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '404'
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
