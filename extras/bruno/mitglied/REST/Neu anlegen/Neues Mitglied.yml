info:
  name: "Neues Mitglied"
  type: http
  seq: 1

http:
  method: POST
  url: "{{restUrl}}"
  body:
    type: json
    data: |-
      {
        "vorname": "Bruno",
        "nachname": "Testrest",
        "email": "{{testEmail}}",
        "geburtsdatum": "2000-01-01",
        "geschlecht": "D",
        "interessen": [
          "Yoga"
        ],
        "vertrag": {
          "beginn": "2026-10-01",
          "monatlicher_beitrag": "29.90",
          "tarif": "STUDENT",
          "getraenkeflat": true
        },
        "zahlungen": [
          {
            "betrag": "29.90",
            "zahlungsdatum": "2026-10-01"
          }
        ]
      }
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        bru.setVar('testEmail', bru.getEnvVar('testEmail') || ('bruno-' + Date.now() + '@example.org'));

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('mitgliedUrl', res.getHeaders()['location']);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
