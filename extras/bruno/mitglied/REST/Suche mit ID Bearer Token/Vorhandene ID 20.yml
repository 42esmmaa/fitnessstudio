info:
  name: "Vorhandene ID 20"
  type: http
  seq: 1

http:
  method: GET
  url: "{{restUrl}}/:id"
  params:
    - name: "id"
      value: "20"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "20"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
