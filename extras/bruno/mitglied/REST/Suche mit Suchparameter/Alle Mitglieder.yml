info:
  name: "Alle Mitglieder"
  type: http
  seq: 1

http:
  method: GET
  url: "{{restUrl}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
