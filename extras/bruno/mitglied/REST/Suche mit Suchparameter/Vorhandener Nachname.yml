info:
  name: Vorhandener Nachname
  type: http
  seq: 2
http:
  method: GET
  url: '{{restUrl}}?nachname=Alpha'
  auth: inherit
  params:
    - name: nachname
      value: Alpha
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.content[0].nachname
      operator: eq
      value: Alpha
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
