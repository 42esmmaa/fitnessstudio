info:
  name: Alle Seite 2
  type: http
  seq: 7
http:
  method: GET
  url: '{{restUrl}}?page=1&size=5'
  auth: inherit
  params:
    - name: page
      value: '1'
      type: query
    - name: size
      value: '5'
      type: query
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.page.number
      operator: eq
      value: '1'
    - expression: res.body.page.size
      operator: eq
      value: '5'
    - expression: res.body.content
      operator: isNotEmpty
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
