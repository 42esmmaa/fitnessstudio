info:
  name: Token ohne Benutzerkennung
  type: http
  seq: 3
http:
  method: QUERY
  url: '{{tokenUrl}}'
  auth: inherit
  body:
    type: json
    data: |-
      {
        "password": "{{password}}"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '401'
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
