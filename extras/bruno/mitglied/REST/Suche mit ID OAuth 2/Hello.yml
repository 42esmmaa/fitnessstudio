info:
  name: Hello
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/'
  auth: inherit
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.message
      operator: eq
      value: Hello Fitnessstudio
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
