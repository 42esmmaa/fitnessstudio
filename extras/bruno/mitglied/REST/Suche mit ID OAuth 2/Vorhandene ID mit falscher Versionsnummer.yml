info:
  name: Vorhandene ID mit falscher Versionsnummer
  type: http
  seq: 3
http:
  method: GET
  url: '{{restUrl}}/1'
  auth: inherit
  headers:
    - name: If-None-Match
      value: xxx
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.id
      operator: eq
      value: '1'
settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5
